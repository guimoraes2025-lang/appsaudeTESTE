spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.flyway.enabled=true
spring.flyway.placeholders.staff_atendente_cpf=${APP_STAFF_ATENDENTE_CPF:}
spring.flyway.placeholders.staff_atendente_hash=${APP_STAFF_ATENDENTE_BCRYPT_HASH:}
spring.flyway.placeholders.staff_medico_cpf=${APP_STAFF_MEDICO_CPF:}
spring.flyway.placeholders.staff_medico_crm=${APP_STAFF_MEDICO_CRM:}
spring.flyway.placeholders.staff_medico_hash=${APP_STAFF_MEDICO_BCRYPT_HASH:}
app.auth.jwt-secret=${APP_AUTH_JWT_SECRET}
