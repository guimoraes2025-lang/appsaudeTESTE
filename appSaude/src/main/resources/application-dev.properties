# Banco local em memória. O Flyway usa sintaxe específica do PostgreSQL nas migrations;
# no perfil dev o Hibernate cria/atualiza o schema diretamente pelas entidades.
spring.datasource.url=jdbc:h2:mem:appsaude;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.flyway.enabled=false
app.auth.jwt-secret=${APP_AUTH_JWT_SECRET:dev-only-secret-key-change-before-production-1234567890}
